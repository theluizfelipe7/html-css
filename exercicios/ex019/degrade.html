<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * {/* o asterisco é um seletor universal, ou seja, ele seleciona todos os elementos da página. */

            padding: 0;
            height: 100%;
        }
        body {
            background: linear-gradient(to right, purple, pink, black);
        }
    </style>
</head>

</body>
</html>
