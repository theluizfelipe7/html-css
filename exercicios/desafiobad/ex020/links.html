<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personalizando links</title>
    <style>
        /* SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudoclasses
            :: = pseudoelementos
            > = clidren
        */
        body { 
            font-family: Arial, sans-serif;
            
        }
        a {
            color: red;
            text-decoration: none ;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: rgba(253, 0, 0, 0.452);
        }
        .especial::after {
            content: 'REAL';
            color: rgb(255, 187, 0);
        }
        a::after{
            content: ' ←_←';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }
        a:before {
            content: ' →_→';
            text-decoration: none;
            font-weight: normal;
            color: black;
        }
    </style>
</head>
<body>
    <h1>perasonalizando links </h1>
    <ul>
        <li><a href="">repositorio do GitHub</a></li>
        <li class="especial"><a href="Canal do YouTube">Canal do YouTube</a></li>
        <li><a href="site do CursoemVideo">site do CursoemVideo</a></li>
    </ul>

</body>
</html>
