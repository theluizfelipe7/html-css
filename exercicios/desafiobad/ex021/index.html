<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grouping TAGS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(11, 27, 18);
            margin: 0px;
            
        }
        header {
            background-color: rgb(255, 255, 255);
            padding: 0px;
            margin: 0px;
            border-radius: 0px;
        }
        nav {
            background-color: rgb(165, 165, 165);
            padding: 3px;
            box-shadow: 5px 3px 7px 1px rgba(0, 0, 0, 0.548);
            
        }
        nav > a {
            color: rgb(255, 253, 253);
            text-decoration: none;
            font-weight: bold;
            margin-right: 30px;
            
        }
        nav > a:hover {
            color: rgb(0, 0, 0);
            text-decoration: underline;
            
        }
        main {
            background-color: rgb(255, 255, 255);
            padding: 10px;
            margin: 10px;
            border-radius: 10px 0px;
            
            
            
        }
        footer{
            background-color: rgb(0, 0, 0);
            color: white;
            padding: 1px;
            margin: 10px 0px;
            box-shadow: 5px 3px 7px 1px rgba(0, 0, 0, 0.548);
            text-align: center;

        }
        footer > p {
            margin: 0px;
        }
        article {
            background-color: lightgray;
            padding: 5px;
            margin: 10px;
            box-shadow: 5px 3px 7px 1px rgba(0, 0, 0, 0.548);

        }
        article > aside {
            background-color: rgb(165, 165, 165);
            
        }
        div#bola{
            height: 100px;
            width: 100px;
            background-color: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <header>
        <h1>MEU SITE</h1>
        <Nav>
            <a href="">LINK</a>
            <a href="">LINK</a>
            <a href="">LINK</a>
            <a href="">LINK</a>
            <a href="">LINK</a>
        </Nav>

    </header>
    <main>
        <section id="assuntos">
            <p>Esportes politicas  teclogia</p>

        </section>
        <section id="noticias">
            <article>
                <h2>Noticia sobre o brasil</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>
                <aside>
                    <P>Artgo escito por maria josé</P>
                </aside>
            </article>

        </section>


    </main>
    <footer>
        <p>aula do curso em video</p>
    

    </footer>
    <div id="bola"></div>
    
</body>
</html>
